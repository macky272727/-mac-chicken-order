<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mac Chicken - Admin Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }
    header {
      background: #111;
      color: white;
      padding: 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    header h1 {
      margin: 0;
      font-size: 21px;
    }
    header small {
      color: #d4af37;
      font-weight: bold;
    }
    button {
      border: none;
      border-radius: 8px;
      padding: 10px 15px;
      cursor: pointer;
      font-weight: bold;
    }
    .logout {
      background: #c62828;
      color: white;
    }
    .container {
      max-width: 1200px;
      margin: auto;
      padding: 18px;
    }
    .login-box {
      max-width: 420px;
      margin: 70px auto;
      background: white;
      padding: 25px;
      border-radius: 14px;
      box-shadow: 0 5px 25px rgba(0,0,0,.08);
    }
    .login-box h2 {
      margin-top: 0;
      color: #b00000;
    }
    input,
    select {
      width: 100%;
      padding: 12px;
      margin-top: 7px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 15px;
      background: white;
    }
    .login-btn {
      width: 100%;
      background: #b00000;
      color: white;
      padding: 13px;
    }
    .dashboard {
      display: none;
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 14px;
      margin: 20px 0;
    }
    .stat {
      background: white;
      padding: 18px;
      border-radius: 12px;
      box-shadow: 0 3px 12px rgba(0,0,0,.06);
    }
    .stat span {
      display: block;
      color: #777;
      font-size: 13px;
      margin-bottom: 8px;
    }
    .stat strong {
      font-size: 25px;
      color: #b00000;
    }
    .stat.paid strong {
      color: #16821c;
    }
    .filters {
      background: white;
      padding: 18px;
      border-radius: 12px;
      margin-bottom: 18px;
      box-shadow: 0 3px 12px rgba(0,0,0,.06);
    }
    .filter-grid {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr 1fr 1fr;
      gap: 12px;
    }
    .orders-box {
      background: white;
      border-radius: 12px;
      padding: 18px;
      box-shadow: 0 3px 12px rgba(0,0,0,.06);
      overflow-x: auto;
    }
    .orders-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }
    .orders-title h2 {
      margin: 0;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 1150px;
    }
    th,
    td {
      padding: 11px 9px;
      border-bottom: 1px solid #eee;
      text-align: left;
      font-size: 14px;
    }
    th {
      background: #fafafa;
      font-size: 13px;
    }
    .status,
    .payment-status {
      min-width: 125px;
      margin: 0;
      padding: 8px;
    }
    .payment-status {
      min-width: 145px;
    }
    .view-btn {
      background: #111;
      color: white;
      padding: 8px 12px;
      font-size: 12px;
      white-space: nowrap;
    }
    .empty {
      text-align: center;
      padding: 30px;
      color: #777;
    }
    .error {
      background: #ffe5e5;
      color: #a00000;
      padding: 13px;
      border-radius: 8px;
      margin-bottom: 15px;
      display: none;
    }
    .success {
      background: #e7f7e7;
      color: #176b17;
      padding: 13px;
      border-radius: 8px;
      margin-bottom: 15px;
      display: none;
    }
    /* ORDER DETAILS MODAL */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.72);
      z-index: 2000;
      padding: 20px;
      overflow-y: auto;
    }
    .modal-box {
      max-width: 650px;
      margin: 30px auto;
      background: white;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 10px 40px rgba(0,0,0,.3);
    }
    .modal-header {
      background: #111;
      color: white;
      padding: 18px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    .modal-header h2 {
      margin: 0;
      font-size: 20px;
    }
    .close-btn {
      background: #c62828;
      color: white;
      border-radius: 50%;
      width: 38px;
      height: 38px;
      padding: 0;
      font-size: 20px;
    }
    .details-body {
      padding: 20px;
    }
    .details-id {
      background: #fff8df;
      border: 1px solid #ead68b;
      border-radius: 12px;
      padding: 14px;
      text-align: center;
      margin-bottom: 18px;
    }
    .details-id small {
      display: block;
      color: #777;
      margin-bottom: 5px;
    }
    .details-id strong {
      font-size: 20px;
      color: #a00000;
    }
    .detail-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .detail-card {
      background: #f7f7f7;
      border-radius: 11px;
      padding: 13px;
    }
    .detail-card.full {
      grid-column: 1 / -1;
    }
    .detail-card small {
      display: block;
      color: #777;
      font-size: 11px;
      margin-bottom: 5px;
      text-transform: uppercase;
      font-weight: bold;
    }
    .detail-card strong {
      display: block;
      font-size: 15px;
      word-break: break-word;
    }
    .detail-price {
      color: #a00000;
      font-size: 20px !important;
    }
    .modal-actions {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }
    .whatsapp-btn {
      flex: 1;
      background: #25d366;
      color: white;
      text-align: center;
      padding: 13px;
      border-radius: 10px;
      font-weight: bold;
      text-decoration: none;
    }
    .close-large {
      flex: 1;
      background: #222;
      color: white;
      padding: 13px;
    }
    @media (max-width: 1000px) {
      .stats {
        grid-template-columns: repeat(3, 1fr);
      }
      .filter-grid {
        grid-template-columns: 1fr 1fr;
      }
    }
    @media (max-width: 800px) {
      .stats {
        grid-template-columns: repeat(2, 1fr);
      }
      .filter-grid {
        grid-template-columns: 1fr;
      }
      header {
        align-items: flex-start;
      }
    }
    @media (max-width: 500px) {
      .stats {
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }
      .stat {
        padding: 13px;
      }
      .stat strong {
        font-size: 20px;
      }
      .container {
        padding: 10px;
      }
      .detail-grid {
        grid-template-columns: 1fr;
      }
      .detail-card.full {
        grid-column: auto;
      }
      .modal {
        padding: 10px;
      }
      .modal-box {
        margin: 10px auto;
      }
      .modal-actions {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
<header>
  <div>
    <h1>🐔 Mac Chicken</h1>
    <small>ADMIN DASHBOARD</small>
  </div>
  <button class="logout" onclick="logout()">
    Logout
  </button>
</header>
<!-- LOGIN -->
<div id="loginSection" class="login-box">
  <h2>Admin Login</h2>
  <div id="loginError" class="error"></div>

Email

<input
type=“email”
id=“email”
placeholder=“Admin email”

Password

<input
type=“password”
id=“password”
placeholder=“Password”

<button
class=“login-btn”
onclick=“login()”

Login
  </button>
</div>
<!-- DASHBOARD -->
<div id="dashboard" class="dashboard">
  <div class="container">
<div id="errorBox" class="error"></div>
<div id="successBox" class="success"></div>
<!-- STATS -->
<div class="stats">
  <div class="stat">
    <span>Total Orders</span>
    <strong id="totalOrders">
      0
    </strong>
  </div>
  <div class="stat">
    <span>Pending Orders</span>
    <strong id="pendingOrders">
      0
    </strong>
  </div>
  <div class="stat">
    <span>Chickens Sold</span>
    <strong id="totalChickens">
      0
    </strong>
  </div>
  <div class="stat">
    <span>Total Sales</span>
    <strong id="totalSales">
      TSh 0
    </strong>
  </div>
  <div class="stat paid">
    <span>Paid Orders</span>
    <strong id="paidOrders">
      0
    </strong>
  </div>
</div>
<!-- FILTERS -->
<div class="filters">
  <h3>
    Search & Filter
  </h3>
  <div class="filter-grid">
    <input

      placeholder="Search Order ID, name or phone..."
      oninput="renderOrders()"

    <select
      id="locationFilter"

    <select

    >

    >
      <option value="">

      <option value="Pending">
        Pending
      </option>
      <option value="Confirmed">
        Confirmed
      </option>
      <option value="Ready">
        Ready
      </option>
      <option value="Delivered">
        Delivered
      </option>
      <option value="Cancelled">
        Cancelled
      </option>

      id="paymentFilter"

    >

      </option>

        Pay at Delivery

</div>
<!-- ORDERS -->
<div class="orders-box">
  <div class="orders-title">
    <h2>
      Customer Orders
    </h2>
    <button onclick="loadOrders()">
      🔄 Refresh
    </button>
  </div>
  <div id="orderCount">
    0 orders
  </div>
  <br>
  <table>
    <thead>
      <tr>
        <th>
          Order ID
        </th>
        <th>
          Customer
        </th>
        <th>
          Phone
        </th>
        <th>
          Location
        </th>
        <th>
          Qty
        </th>
        <th>
          Price
        </th>
        <th>
          Delivery
        </th>
        <th>
          Payment Method
        </th>
        <th>
          Payment Status
        </th>
        <th>
          Order Status
        </th>
        <th>
          Details
        </th>
      </tr>
    </thead>
    <tbody id="ordersTable">
    </tbody>
  </table>
</div>
  </div>
</div>
<!-- ORDER DETAILS MODAL -->
<div
  id="orderModal"
  class="modal"
  onclick="closeModalOutside(event)"
>
  <div
    class="modal-box"
    onclick="event.stopPropagation()"
  >
<div class="modal-header">
  <h2>
    🐔 Order Details
  </h2>
  <button
    class="close-btn"
    onclick="closeOrderDetails()"
  >
    ×
  </button>
</div>
<div
  id="detailsBody"
  class="details-body"
>
</div>
  </div>
</div>
<script>
  /* SUPABASE */
  const SUPABASE_URL =
    "https://tuqrnlaofriqggeaoqxb.supabase.co";
  const SUPABASE_KEY =
    "sb_publishable_NVTmWBHQVN8faM4tBcCpxg_IBW45wI_";
  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );
  let allOrders = [];
  /* ALERTS */
  function showError(
    message,
    target = "errorBox"
  ) {
    const box =
      document.getElementById(target);
    box.textContent =
      message;
    box.style.display =
      "block";
    setTimeout(() => {
      box.style.display =
        "none";
    }, 5000);
  }
  function showSuccess(message) {
    const box =
      document.getElementById(
        "successBox"
      );
    box.textContent =
      message;
    box.style.display =
      "block";
    setTimeout(() => {
      box.style.display =
        "none";
    }, 4000);
  }
  /* LOGIN */
  async function login() {
    const email =
      document.getElementById(
        "email"
      ).value.trim();
    const password =
      document.getElementById(
        "password"
      ).value;
    if (!email || !password) {
      showError(
        "Please enter email and password.",
        "loginError"
      );
      return;
    }
    const { error } =
      await supabaseClient.auth
        .signInWithPassword({
          email:
            email,
          password:
            password
        });
    if (error) {
      showError(
        error.message,
        "loginError"
      );
      return;
    }
    await checkSession();
  }
  /* SESSION */
  async function checkSession() {
    const { data } =
      await supabaseClient.auth
        .getSession();
    if (data.session) {
      document.getElementById(
        "loginSection"
      ).style.display =
        "none";
      document.getElementById(
        "dashboard"
      ).style.display =
        "block";
      await loadOrders();
    } else {
      document.getElementById(
        "loginSection"
      ).style.display =
        "block";
      document.getElementById(
        "dashboard"
      ).style.display =
        "none";
    }
  }
  /* LOGOUT */
  async function logout() {
    await supabaseClient.auth
      .signOut();
    document.getElementById(
      "dashboard"
    ).style.display =
      "none";
    document.getElementById(
      "loginSection"
    ).style.display =
      "block";
  }
  /* LOAD ORDERS */
  async function loadOrders() {
    const { data, error } =
      await supabaseClient
        .from("orders")
        .select("*");
    if (error) {
      showError(
        "Error loading orders: " +
        error.message
      );
      return;
    }
    allOrders =
      data || [];
    updateStats();
    renderOrders();
  }
  /* STATS */
  function updateStats() {
    const totalOrders =
      allOrders.length;
    const pendingOrders =
      allOrders.filter(
        order =>
          order.order_status ===
          "Pending"
      ).length;
    const totalChickens =
      allOrders
        .filter(
          order =>
            order.order_status !==
            "Cancelled"
        )
        .reduce(
          (sum, order) =>
            sum +
            Number(
              order.quantity || 0
            ),
          0
        );
    const totalSales =
      allOrders
        .filter(
          order =>
            order.order_status !==
            "Cancelled"
        )
        .reduce(
          (sum, order) =>
            sum +
            Number(
              order.price || 0
            ),
          0
        );
    const paidOrders =
      allOrders.filter(
        order =>
          order.payment_status ===
          "Paid"
      ).length;
    document.getElementById(
      "totalOrders"
    ).textContent =
      totalOrders;
    document.getElementById(
      "pendingOrders"
    ).textContent =
      pendingOrders;
    document.getElementById(
      "totalChickens"
    ).textContent =
      totalChickens;
    document.getElementById(
      "totalSales"
    ).textContent =
      "TSh " +
      totalSales.toLocaleString();
    document.getElementById(
      "paidOrders"
    ).textContent =
      paidOrders;
  }
  /* RENDER ORDERS */
  function renderOrders() {
    const search =
      document.getElementById(
        "search"
      ).value
      .toLowerCase()
      .trim();
    const location =
      document.getElementById(
        "locationFilter"
      ).value;
    const delivery =
      document.getElementById(
        "deliveryFilter"
      ).value;
    const status =
      document.getElementById(
        "statusFilter"
      ).value;
    const paymentStatus =
      document.getElementById(
        "paymentFilter"
      ).value;
    const filtered =
      allOrders.filter(order => {
        const matchesSearch =
          !search ||
          String(
            order.order_id || ""
          )
            .toLowerCase()
            .includes(search) ||
          String(
            order.customer_name || ""
          )
            .toLowerCase()
            .includes(search) ||
          String(
            order.phone || ""
          )
            .toLowerCase()
            .includes(search);
        const matchesLocation =
          !location ||
          order.location ===
            location;
        const matchesDelivery =
          !delivery ||
          order.delivery_method ===
            delivery;
        const matchesStatus =
          !status ||
          order.order_status ===
            status;
        const matchesPaymentStatus =
          !paymentStatus ||
          (
            order.payment_status ||
            "Pending"
          ) ===
            paymentStatus;
        return (
          matchesSearch &&
          matchesLocation &&
          matchesDelivery &&
          matchesStatus &&
          matchesPaymentStatus
        );
      });
    document.getElementById(
      "orderCount"
    ).textContent =
      filtered.length +
      " orders";
    const table =
      document.getElementById(
        "ordersTable"
      );
    if (!filtered.length) {
      table.innerHTML = `
        <tr>
          <td
            colspan="11"
            class="empty"
          >
            No orders found.
          </td>
        </tr>
      `;
      return;
    }
    table.innerHTML =
      filtered.map(order => {
        const paymentStatus =
          order.payment_status ||
          "Pending";
        return `
          <tr>
            <td>
              <strong>
                ${escapeHtml(
                  order.order_id || ""
                )}
              </strong>
            </td>
            <td>
              ${escapeHtml(
                order.customer_name || ""
              )}
            </td>
            <td>
              ${escapeHtml(
                order.phone || ""
              )}
            </td>
            <td>
              ${escapeHtml(
                order.location || ""
              )}
            </td>
            <td>
              ${Number(
                order.quantity || 0
              )}
            </td>
            <td>
              TSh ${
                Number(
                  order.price || 0
                ).toLocaleString()
              }
            </td>
            <td>
              ${escapeHtml(
                order.delivery_method || ""
              )}
            </td>
            <td>
              ${escapeHtml(
                order.payment_method || ""
              )}
            </td>
            <td>
              <select
                class="payment-status"
                onchange="updatePaymentStatus(
                  '${escapeHtml(
                    order.order_id
                  )}',
                  this.value
                )"
              >
                <option
                  value="Pending"
                  ${
                    paymentStatus ===
                    "Pending"
                      ? "selected"
                      : ""
                  }
                >
                  Pending
                </option>
                <option
                  value="Paid"
                  ${
                    paymentStatus ===
                    "Paid"
                      ? "selected"
                      : ""
                  }
                >
                  Paid
                </option>
                <option
                  value="Pay at Delivery"
                  ${
                    paymentStatus ===
                    "Pay at Delivery"
                      ? "selected"
                      : ""
                  }
                >
                  Pay at Delivery
                </option>
              </select>
            </td>
            <td>
              <select
                class="status"
                onchange="updateStatus(
                  '${escapeHtml(
                    order.order_id
                  )}',
                  this.value
                )"
              >
                <option
                  value="Pending"
                  ${
                    order.order_status ===
                    "Pending"
                      ? "selected"
                      : ""
                  }
                >
                  Pending
                </option>
                <option
                  value="Confirmed"
                  ${
                    order.order_status ===
                    "Confirmed"
                      ? "selected"
                      : ""
                  }
                >
                  Confirmed
                </option>
                <option
                  value="Ready"
                  ${
                    order.order_status ===
                    "Ready"
                      ? "selected"
                      : ""
                  }
                >
                  Ready
                </option>
                <option
                  value="Delivered"
                  ${
                    order.order_status ===
                    "Delivered"
                      ? "selected"
                      : ""
                  }
                >
                  Delivered
                </option>
                <option
                  value="Cancelled"
                  ${
                    order.order_status ===
                    "Cancelled"
                      ? "selected"
                      : ""
                  }
                >
                  Cancelled
                </option>
              </select>
            </td>
            <td>
              <button
                class="view-btn"
                onclick="viewOrder(
                  '${escapeHtml(
                    order.order_id
                  )}'
                )"
              >
                👁️ View
              </button>
            </td>
          </tr>
        `;
      }).join("");
  }
  /* PAYMENT STATUS */
  async function updatePaymentStatus(
    orderId,
    newPaymentStatus
  ) {
    const { error } =
      await supabaseClient
        .from("orders")
        .update({
          payment_status:
            newPaymentStatus
        })
        .eq(
          "order_id",
          orderId
        );
    if (error) {
      showError(
        "Failed to update payment status: " +
        error.message
      );
      await loadOrders();
      return;
    }
    const order =
      allOrders.find(
        item =>
          item.order_id ===
          orderId
      );
    if (order) {
      order.payment_status =
        newPaymentStatus;
    }
    updateStats();
    renderOrders();
    showSuccess(
      "Payment status updated successfully."
    );
  }
  /* ORDER STATUS */
  async function updateStatus(
    orderId,
    newStatus
  ) {
    const { error } =
      await supabaseClient
        .from("orders")
        .update({
          order_status:
            newStatus
        })
        .eq(
          "order_id",
          orderId
        );
    if (error) {
      showError(
        "Failed to update status: " +
        error.message
      );
      await loadOrders();
      return;
    }
    const order =
      allOrders.find(
        item =>
          item.order_id ===
          orderId
      );
    if (order) {
      order.order_status =
        newStatus;
    }
    updateStats();
    renderOrders();
    showSuccess(
      "Order status updated successfully."
    );
  }
  /* VIEW ORDER DETAILS */
  function viewOrder(orderId) {
    const order =
      allOrders.find(
        item =>
          item.order_id ===
          orderId
      );
    if (!order) {
      showError(
        "Order not found."
      );
      return;
    }
    const paymentStatus =
      order.payment_status ||
      "Pending";
    let requiredDate =
      order.required_datetime ||
      "";
    if (requiredDate) {
      try {
        requiredDate =
          new Date(
            requiredDate
          ).toLocaleString(
            "en-GB"
          );
      } catch (error) {
        requiredDate =
          String(
            requiredDate
          );
      }
    }
    const phone =
      String(
        order.phone || ""
      ).replace(
        /\D/g,
        ""
      );
    let whatsappPhone =
      phone;
    if (
      whatsappPhone.startsWith("0")
    ) {
      whatsappPhone =
        "255" +
        whatsappPhone.substring(1);
    }
    const message =
      encodeURIComponent(
        "Hello " +
        (order.customer_name || "") +
        ", this is Mac Chicken regarding your order " +
        (order.order_id || "") +
        "."
      );
    const whatsappLink =
      whatsappPhone
        ? "https://wa.me/" +
          whatsappPhone +
          "?text=" +
          message
        : "#";
    document.getElementById(
      "detailsBody"
    ).innerHTML = `
      <div class="details-id">
        <small>
          ORDER ID
        </small>
        <strong>
          ${escapeHtml(
            order.order_id || ""
          )}
        </strong>
      </div>
      <div class="detail-grid">
        <div class="detail-card">
          <small>
            Customer
          </small>
          <strong>
            ${escapeHtml(
              order.customer_name || "-"
            )}
          </strong>
        </div>
        <div class="detail-card">
          <small>
            Phone
          </small>
          <strong>
            ${escapeHtml(
              order.phone || "-"
            )}
          </strong>
        </div>
        <div class="detail-card">
          <small>
            Location
          </small>
          <strong>
            ${escapeHtml(
              order.location || "-"
            )}
          </strong>
        </div>
        <div class="detail-card">
          <small>
            Delivery Method
          </small>
          <strong>
            ${escapeHtml(
              order.delivery_method || "-"
            )}
          </strong>
        </div>
        <div class="detail-card full">
          <small>
            Address / Delivery Location
          </small>
          <strong>
            ${escapeHtml(
              order.address ||
              order.delivery_location ||
              "-"
            )}
          </strong>
        </div>
        <div class="detail-card">
          <small>
            Quantity
          </small>
          <strong>
            ${Number(
              order.quantity || 0
            )} Chicken(s)
          </strong>
        </div>
        <div class="detail-card">
          <small>
            Chicken Cost
          </small>
          <strong class="detail-price">
            TSh ${
              Number(
                order.price || 0
              ).toLocaleString()
            }
          </strong>
        </div>
        <div class="detail-card">
          <small>
            Payment Method
          </small>
          <strong>
            ${escapeHtml(
              order.payment_method || "-"
            )}
          </strong>
        </div>
        <div class="detail-card">
          <small>
            Payment Status
          </small>
          <strong>
            ${escapeHtml(
              paymentStatus
            )}
          </strong>
        </div>
        <div class="detail-card">
          <small>
            Order Status
          </small>
          <strong>
            ${escapeHtml(
              order.order_status || "-"
            )}
          </strong>
        </div>
        <div class="detail-card">
          <small>
            Order Type
          </small>
          <strong>
            ${escapeHtml(
              order.order_type || "-"
            )}
          </strong>
        </div>
        <div class="detail-card">
          <small>
            Delivery Fee
          </small>
          <strong>
            TSh ${
              Number(
                order.delivery_fee || 0
              ).toLocaleString()
            }
          </strong>
        </div>
        <div class="detail-card full">
          <small>
            Required Date / Time
          </small>
          <strong>
            ${escapeHtml(
              requiredDate || "-"
            )}
          </strong>
        </div>
        <div class="detail-card full">
          <small>
            Notes
          </small>
          <strong>
            ${escapeHtml(
              order.notes || "-"
            )}
          </strong>
        </div>
      </div>
      <div class="modal-actions">
        ${
          whatsappPhone
          ? `
            <a
              class="whatsapp-btn"
              href="${whatsappLink}"
              target="_blank"
              rel="noopener"
            >
              📲 WhatsApp Customer
            </a>
          `
          : `
            <button
              class="whatsapp-btn"
              disabled
            >
              📲 No Phone Number
            </button>
          `
        }
        <button
          class="close-large"
          onclick="closeOrderDetails()"
        >
          Close
        </button>
      </div>
    `;
    document.getElementById(
      "orderModal"
    ).style.display =
      "block";
  }
  /* CLOSE MODAL */
  function closeOrderDetails() {
    document.getElementById(
      "orderModal"
    ).style.display =
      "none";
  }
  function closeModalOutside(event) {
    if (
      event.target.id ===
      "orderModal"
    ) {
      closeOrderDetails();
    }
  }
  /* ESCAPE HTML */
  function escapeHtml(value) {
    return String(value)
      .replace(
        /&/g,
        "&amp;"
      )
      .replace(
        /</g,
        "&lt;"
      )
      .replace(
        />/g,
        "&gt;"
      )
      .replace(
        /"/g,
        "&quot;"
      )
      .replace(
        /'/g,
        "&#039;"
      );
  }
  /* START */
  checkSession();
</script>
</body>
</html>
